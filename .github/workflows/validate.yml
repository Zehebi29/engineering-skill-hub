name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
  push:
    paths:
      - 'skills/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md files
        run: |
          echo "Validating skill files..."
          errors=0
          
          for skill_dir in skills/*/; do
            skill_file="${skill_dir}SKILL.md"
            
            if [ ! -f "$skill_file" ]; then
              echo "Missing SKILL.md in $skill_dir"
              errors=$((errors + 1))
              continue
            fi
            
            first_line=$(head -1 "$skill_file")
            if [ "$first_line" != "---" ]; then
              echo "$skill_file: Must start with '---'"
              errors=$((errors + 1))
            fi
            
            for field in name description author tags version license compatible_with; do
              if ! grep -q "^${field}:" "$skill_file"; then
                echo "$skill_file: Missing required field '${field}'"
                errors=$((errors + 1))
              fi
            done
            
            desc=$(grep "^description:" "$skill_file" | head -1 | sed 's/^description: *//')
            if [ ${#desc} -gt 1024 ]; then
              echo "$skill_file: Description exceeds 1024 chars (${#desc})"
              errors=$((errors + 1))
            fi
            
            size=$(wc -c < "$skill_file")
            if [ $size -gt 100000 ]; then
              echo "$skill_file: File exceeds 100KB ($size bytes)"
              errors=$((errors + 1))
            fi
            
            echo "$skill_file: Valid"
          done
          
          if [ $errors -gt 0 ]; then
            echo "Validation failed with $errors error(s)"
            exit 1
          fi
          
          echo "All skills validated successfully!"
